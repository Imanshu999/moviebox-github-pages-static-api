name: Build and Publish MovieBox Static API

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tester/**'
      - 'web/**'
      - 'playground/**'
      - 'v1/**'
      - '.github/workflows/tester-pages.yml'

permissions:
  contents: write

concurrency:
  group: moviebox-static-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build static API JSON from the shared provider core
        run: |
          cargo generate-lockfile
          cargo run --release --bin moviebox-static-export -- dist
      - name: Add static client websites
        run: |
          test -f tester/index.html
          test -f web/index.html
          test -f playground/index.html
          mkdir -p dist/tester dist/web dist/playground
          cp -R tester/. dist/tester/
          cp -R web/. dist/web/
          cp -R playground/. dist/playground/
          mkdir -p dist/v1
          test -f v1/index.html
          cp v1/index.html dist/v1/index.html
      - name: Validate API JSON and client pages
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("dist")
          files = ["manifest.json", "catalog.json", "trending.json", "latest.json", "movies.json", "series.json", "categories.json"]
          for name in files:
              path = root / "v1" / name
              if not path.is_file():
                  raise SystemExit(f"Missing endpoint: {path}")
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          catalog = json.loads((root / "v1/catalog.json").read_text(encoding="utf-8"))
          if not isinstance(catalog, dict) or not isinstance(catalog.get("results"), list) or not catalog["results"]:
              raise SystemExit("Catalog is empty or invalid; refusing to publish an empty catalog.")
          if not (root / "v1/index.html").is_file():
              raise SystemExit("Missing API directory index: dist/v1/index.html")
          for name in ["tester", "web", "playground"]:
              page = root / name / "index.html"
              if not page.is_file() or page.stat().st_size < 1000:
                  raise SystemExit(f"Missing or incomplete client page: {page}")
          print("Validated", len(catalog["results"]), "catalog entries and all client pages.")
          PY
      - name: Publish static site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
