name: Publish MovieBox API Tester

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tester/**'
      - '.github/workflows/tester-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: moviebox-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build static API JSON
        run: cargo run --locked --release --bin moviebox-static-export -- dist
      - name: Add API tester website
        run: |
          test -f tester/index.html
          mkdir -p dist/tester
          cp -R tester/. dist/tester/
      - name: Validate JSON and tester output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("dist")
          files = ["manifest.json", "catalog.json", "trending.json", "latest.json", "movies.json", "series.json", "categories.json"]
          for name in files:
              path = root / "v1" / name
              if not path.is_file():
                  raise SystemExit(f"Missing endpoint: {path}")
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          catalog = json.loads((root / "v1/catalog.json").read_text(encoding="utf-8"))
          if not isinstance(catalog, dict) or not isinstance(catalog.get("results"), list) or not catalog["results"]:
              raise SystemExit("Catalog is empty or invalid; deployment stopped.")
          page = root / "tester/index.html"
          if not page.is_file() or page.stat().st_size < 1000:
              raise SystemExit("Tester page missing or incomplete.")
          print("Validated", len(catalog["results"]), "catalog entries and tester page.")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
